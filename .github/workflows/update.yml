name: update-snow-map

on:
  schedule:
    - cron: "50 * * * *"   # 매시 50분(UTC 기준 매시간이라 한국시간도 매시 50분)
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install requests folium

      - name: 예보 가져와서 지도 만들기
        run: python snow_map.py
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
